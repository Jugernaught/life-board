<!doctype html>
<html lang="en-GB" data-shell="ios" data-style="glass" data-theme="dark" data-accent="blue" data-transparency="full" data-effects="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="LIFE OS for iPhone — your private personal operating system." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LIFE OS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/m/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LIFE OS</title>
    <script>
      // Paint the last-used theme before the app loads (no flash of the wrong colours).
      ;(function () {
        try {
          var a = JSON.parse(localStorage.getItem('life-os:m-appearance') || 'null')
          if (!a) a = { style: 'glass', pref: 'system', accent: 'blue', transparency: 'full', effects: 'on' }
          var d = document.documentElement
          var dark = a.pref === 'dark' || (a.pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          d.dataset.style = a.style
          d.dataset.theme = dark ? 'dark' : 'light'
          d.dataset.accent = a.accent
          d.dataset.transparency = a.transparency
          d.dataset.effects = a.effects
          if (a.textScale && a.textScale !== 1) d.style.setProperty('--text-scale', String(a.textScale))
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LIFE OS needs JavaScript to run.</noscript>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
